# Agent definition — Order Tracking (shopping-assistant demo).
# Provider-neutral: `model` is a config tier name (fast | standard | deep), resolved to the
# active provider's model at instantiation — never a hardcoded model ID.

name: order_tracking
description: >-
  Answers "where is my order" questions: lists the customer's orders and gives
  order status, shipment tracking, and delivery estimates for already-placed
  orders. Read-only — does not modify orders, carts, returns, or payments.

capabilities:
  - order_status
  - order_history
  - shipping_tracking
  - delivery_estimate

tools:
  - order_api
  - list_my_orders

model: fast
max_tokens: 1024

eval_rubric:
  - accuracy
  - completeness
  - clarity
judge_sample_rate: 0.15   # read-only lookup -> low critic sampling

fallback_agent: support_concierge

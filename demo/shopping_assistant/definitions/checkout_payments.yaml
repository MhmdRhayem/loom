# Agent definition — Checkout & Payments (shopping-assistant demo). NEW.
# Owns the "can I complete this purchase" moment: in-cart availability, cart and
# checkout failures, and payment/promo/billing. The SINGLE deep-tier agent (hardest
# reasoning, highest stakes). Tools are cart_api + payment_api (the in-flight
# purchase) and price_api (so promo_apply questions can check a coupon's discount
# and minimum) — deliberately NOT order_api, to stay crisp against order_tracking
# (cart != order).

name: checkout_payments
description: >-
  Resolves problems completing a purchase: cart and checkout failures,
  availability checks for items already in the shopper's cart, and payment,
  promo-code, and billing issues at the point of sale. Works on the in-flight
  cart and payment only, not on already-placed orders, post-purchase returns,
  general catalog stock questions, or store policy questions such as which
  payment methods the store accepts.

capabilities:
  - stock_check
  - cart_ops
  - checkout_support
  - payment_methods
  - promo_apply
  - billing_inquiry

tools:
  - cart_api
  - payment_api
  - price_api

model: deep
max_tokens: 1280

eval_rubric:
  - accuracy
  - policy_compliance
  - transaction_safety
  - clarity
judge_sample_rate: 1.0   # money path -> always judged

fallback_agent: support_concierge
memory_scope: owner

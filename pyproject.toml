# Loom is a flat application, not an installable package: there is no build-system or
# [project] table here. Dependencies live in requirements.txt / requirements-dev.txt and
# the app runs from the repo root (`backend` and `demo` import directly). This file only
# carries tool configuration.

[tool.ruff]
line-length = 100

# Selected explicitly so the enforced rule set is a property of this repo, not of
# whichever ruff version happens to be installed.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = [
    "B008",    # Depends() in argument defaults is FastAPI's documented idiom
    "B905",    # zip() strict=: the sequences are gathered from one list, and a
               # raise here would break the fail-silent agent path
    "RUF012",  # ClassVar on throwaway stub classes inside tests is noise
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_postgres: integration test that needs a live Postgres at DATABASE_URL",
    "requires_redis: integration test that needs a live Redis at REDIS_URL",
]

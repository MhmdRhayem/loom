[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
description = "Loom — an adaptive multi-agent orchestration framework with dynamic routing, self-evaluation, and adaptive learning."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mohammad Rhayem" }]
license = { text = "Proprietary" }
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary,pool]>=3.2.3",
    "redis>=5.2",
    "langgraph>=1.0",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0.3",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.7",
    "langchain-openai>=1.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.15.20",
]
# Used by the shopping-assistant demo (its login layer), not the framework itself.
demo = [
    "pyjwt>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.format]
# match the black line-length above

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "requires_postgres: integration test that needs a live Postgres at DATABASE_URL",
    "requires_redis: integration test that needs a live Redis at REDIS_URL",
]

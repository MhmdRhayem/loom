services:
  postgres:
    image: postgres:18
    container_name: maf-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_agent
    ports:
      # Host 5433 -> container 5432: avoids clashing with a native Postgres on 5432.
      # 127.0.0.1 prefix: these are dev services with default or absent credentials,
      # and an unprefixed mapping publishes them to every interface on the machine.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: maf-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    # Vector database for the demo's semantic retrieval (see VECTOR_DB_CHOICE.md).
    image: qdrant/qdrant:v1.18.2
    container_name: maf-qdrant
    ports:
      # REST API (the Python client's default transport).
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
